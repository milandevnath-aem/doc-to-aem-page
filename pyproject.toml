[project]
name = "aem-content-automation"
version = "0.1.0"
description = "Content automation framework generating AEM pages from structured content sources"
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.1",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# `aem*` also globs `aem_client`. `ui*` needs its own entry -- nothing else
# matches it, and omitting it ships a wheel with no operator UI.
include = ["connectors*", "parser*", "models*", "mapping*", "validators*", "aem*", "config*", "ui*"]

[tool.setuptools.package-data]
# Runtime data, not just build niceties: StaticFiles raises at import when
# its directory is absent, Jinja2Templates has nothing to render without the
# templates, and `load_page_type_from_sample` reads config/samples at runtime.
# Generated/operator-local dirs (ui/static/assets, ui/uploads, config/cache)
# are gitignored and deliberately excluded.
ui = ["templates/*.html", "static/*.css"]
config = ["samples/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated.*",
]
