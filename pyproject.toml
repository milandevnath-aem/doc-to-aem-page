[project]
name = "aem-content-automation"
version = "0.1.0"
description = "Content automation framework generating AEM pages from structured content sources"
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.1",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["connectors*", "parser*", "models*", "mapping*", "validators*", "transformers*", "aem*", "config*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
